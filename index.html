<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyIL Store</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Rubik', sans-serif;
  background: url('sky.png') no-repeat center;
  background-size: cover;
  color: white;
}

.overlay {
  background: rgba(0,0,0,0.8);
  min-height: 100vh;
  display: flex;
}

/* תפריט צד */
.sidebar {
  width: 230px;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(10px);
}

.sidebar h2 {
  text-align: center;
  color: #00bfff;
  padding: 20px;
}

.sidebar a {
  display: block;
  padding: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.sidebar a:hover {
  background: #00bfff;
  color: black;
}

/* תוכן */
.content {
  flex: 1;
  padding: 30px;
}

.section { display: none; }
.active { display: block; }

.title {
  font-size: 40px;
  margin-bottom: 20px;
}

/* כרטיסים */
.container {
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
}

.card {
  background: rgba(0,0,0,0.7);
  border-radius: 20px;
  padding: 20px;
  width: 260px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,191,255,0.4);
  transition: 0.3s;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 0 40px rgba(0,191,255,0.8);
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 12px;
}

.price {
  color: #00bfff;
  font-size: 22px;
  margin: 10px 0;
}

/* 🔥 מודאל */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #111;
  padding: 25px;
  border-radius: 20px;
  width: 350px;
  text-align: center;
  box-shadow: 0 0 40px rgba(0,191,255,0.8);
}

.modal img {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 10px;
}

.close {
  float: right;
  cursor: pointer;
  color: red;
  font-size: 20px;
}

.btn {
  background: #00bfff;
  border: none;
  padding: 10px 20px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
}

/* בקרוב */
.coming {
  font-size: 50px;
  text-align: center;
  margin-top: 100px;
  color: #00bfff;
}
</style>
</head>

<body>

<div class="overlay">

<div class="sidebar">
  <h2>SkyIL</h2>
  <a onclick="show('home')">🏠 בית</a>
  <a onclick="show('cars')">🚗 רכבים</a>
  <a onclick="show('money')">💰 כסף</a>
  <a onclick="show('unban')">🔓 אנבאן</a>
  <a onclick="show('pads')">📦 פדים</a>
</div>

<div class="content">

<!-- בית -->
<div id="home" class="section active">
  <div class="title">SkyIL RolePlay 🔥</div>
</div>

<!-- רכבים -->
<div id="cars" class="section">
  <div class="title">🚗 רכבים</div>

  <div class="container">
    <div class="card" onclick="openProduct('רכב קאסטום',30,'car.png')">
      <img src="car.png">
      <h3>רכב קאסטום</h3>
      <div class="price">₪30</div>
    </div>
  </div>
</div>

<!-- כסף -->
<div id="money" class="section">
  <div class="title">💰 חבילות כסף</div>

  <div class="container">

    <div class="card" onclick="openProduct('10K כסף',10,'money.png')">
      <img src="money.png">
      <h3>10K</h3>
      <div class="price">₪10</div>
    </div>

    <div class="card" onclick="openProduct('500K כסף',25,'cash.png')">
      <img src="cash.png">
      <h3>500K</h3>
      <div class="price">₪25</div>
    </div>

    <div class="card" onclick="openProduct('1M כסף',50,'https://cdn-icons-png.flaticon.com/512/2331/2331947.png')">
      <img src="https://cdn-icons-png.flaticon.com/512/2331/2331947.png">
      <h3>1M</h3>
      <div class="price">₪50</div>
    </div>

  </div>
</div>

<!-- אנבאן -->
<div id="unban" class="section">
  <div class="title">🔓 אנבאן</div>

  <div class="container">

    <div class="card" onclick="openProduct('1-4 ימים',10,'https://cdn.discordapp.com/attachments/1430533329152774316/1495331527553318962/image.png')">
      <img src="https://cdn.discordapp.com/attachments/1430533329152774316/1495331527553318962/image.png">
      <h3>1-4 ימים</h3>
      <div class="price">₪10</div>
    </div>

    <div class="card" onclick="openProduct('פרמה',100,'https://cdn.discordapp.com/attachments/1430533329152774316/1495331527553318962/image.png')">
      <img src="https://cdn.discordapp.com/attachments/1430533329152774316/1495331527553318962/image.png">
      <h3>פרמה</h3>
      <div class="price">₪100</div>
    </div>

  </div>
</div>

<!-- פדים -->
<div id="pads" class="section">
  <div class="coming">בקרוב...</div>
</div>

</div>
</div>

<!-- 🔥 חלון מוצר -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeProduct()">✖</span>

    <img id="pimg">
    <h2 id="pname"></h2>
    <p id="pprice"></p>

    <button class="btn" onclick="buy()">קנה עכשיו</button>
  </div>
</div>

<script>
let currentPrice = 0;

function show(section) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(section).classList.add('active');
}

function openProduct(name, price, img) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("pname").innerText = name;
  document.getElementById("pprice").innerText = "₪" + price;
  document.getElementById("pimg").src = img;
  currentPrice = price;
}

function closeProduct() {
  document.getElementById("modal").style.display = "none";
}

function buy() {
  window.open("https://paypal.me/saharshevach/" + currentPrice);
}
</script>

</body>
</html>
