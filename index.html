<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyIL Store</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Rubik', sans-serif;
  background: url('sky.png') no-repeat center;
  background-size: cover;
  color: white;
}

/* רקע */
.overlay {
  background: radial-gradient(circle at top, rgba(0,191,255,0.15), transparent),
              rgba(0,0,0,0.9);
  min-height: 100vh;
  display: flex;
}

/* 🔥 תפריט צד */
.sidebar {
  width: 240px;
  background: linear-gradient(180deg, #050505, #0f0f0f);
  border-right: 1px solid rgba(0,191,255,0.3);
}

.sidebar h2 {
  text-align: center;
  color: #00bfff;
  padding: 20px;
  font-size: 26px;
  text-shadow: 0 0 15px #00bfff;
}

.sidebar a {
  display: block;
  padding: 15px;
  margin: 8px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.sidebar a:hover,
.sidebar a.active {
  background: rgba(0,191,255,0.2);
  transform: translateX(5px);
}

/* תוכן */
.content {
  flex: 1;
  padding: 30px;
}

.section { display: none; }
.active { display: block; }

/* תקנון */
.fullscreen-rules {
  text-align: center;
}

.fullscreen-rules h1 {
  font-size: 50px;
  color: #00bfff;
}

.fullscreen-rules p {
  font-size: 20px;
  font-weight: bold;
}

/* כרטיסים */
.container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.card {
  width: 260px;
  padding: 20px;
  border-radius: 20px;
  background: rgba(0,0,0,0.7);
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 0 20px #00bfff;
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 10px;
}

.price {
  color: #00bfff;
}

/* מודאל */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal-content {
  position: relative;
  background: #111;
  padding: 20px;
  border-radius: 20px;
  width: 350px;
  text-align: center;
}

/* X */
.close {
  position: absolute;
  top: -15px;
  right: -15px;
  width: 40px;
  height: 40px;
  background: #111;
  border: 2px solid #00bfff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.btn {
  background: #00bfff;
  border: none;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

/* דיסקורד */
.discord-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 60px;
  height: 60px;
  background: #5865F2;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<div class="overlay">

<div class="sidebar">
  <h2>SkyIL</h2>
  <a onclick="show('home', this)" class="active">📜 תקנון</a>
  <a onclick="show('cars', this)">🚗 רכבים</a>
  <a onclick="show('money', this)">💰 כסף</a>
  <a onclick="show('unban', this)">🔓 אנבאן</a>
</div>

<div class="content">

<!-- תקנון -->
<div id="home" class="section active">
  <div class="fullscreen-rules">
    <h1>📜 תקנון</h1>
    <p>ברוכים הבאים לאתר הקהילה שלנו SkyIL</p>
    <p>לפני כל קנייה חובה לפתוח טיקט בדיסקורד</p>
    <p><a href="https://discord.gg/TXujcHys" target="_blank">כניסה לדיסקורד</a></p>
    <p>אין החזרים!</p>
  </div>
</div>

<!-- רכבים -->
<div id="cars" class="section">
  <h1>🚗 רכבים</h1>
  <div class="container">
    <div class="card" onclick="openProduct('רכב קאסטום',50,'car.png','🚀 350+ קמש\n⚡ קפיצה + בוסט + מצנח\n🛡️ חלונות משוריינים')">
      <img src="car.png">
      <h3>רכב קאסטום</h3>
      <p class="price">₪50</p>
    </div>
  </div>
</div>

<!-- כסף -->
<div id="money" class="section">
  <h1>💰 כסף</h1>
  <div class="container">
    <div class="card" onclick="openProduct('100K',10,'cash.png','חבילה בסיסית')"><img src="cash.png"><p>100K</p></div>
    <div class="card" onclick="openProduct('250K',25,'cash.png','חבילה בינונית')"><img src="cash.png"><p>250K</p></div>
    <div class="card" onclick="openProduct('500K',50,'cash.png','חבילה מתקדמת')"><img src="cash.png"><p>500K</p></div>
    <div class="card" onclick="openProduct('1M',70,'cash.png','חבילת פרימיום')"><img src="cash.png"><p>1M</p></div>
  </div>
</div>

<!-- אנבאן -->
<div id="unban" class="section">
  <h1>🔓 אנבאן</h1>
  <div class="container">
    <div class="card" onclick="openProduct('1-6 ימים',10,'unban.png','אנבאן קצר')"><img src="unban.png"></div>
    <div class="card" onclick="openProduct('6-18 ימים',25,'unban.png','אנבאן בינוני')"><img src="unban.png"></div>
    <div class="card" onclick="openProduct('חודשיים+',40,'unban.png','אנבאן ארוך')"><img src="unban.png"></div>
    <div class="card" onclick="openProduct('פרמה',100,'unban.png','קבוע')"><img src="unban.png"></div>
    <div class="card" onclick="openProduct('אנטי ציט',150,'unban.png','הגנה')"><img src="unban.png"></div>
  </div>
</div>

</div>
</div>

<!-- מודאל -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeProduct()">✕</span>
    <img id="pimg">
    <h2 id="pname"></h2>
    <p id="pprice"></p>
    <p id="pdesc"></p>
    <button class="btn" onclick="buy()">קנה</button>
  </div>
</div>

<!-- דיסקורד -->
<a href="https://discord.gg/TXujcHys" target="_blank" class="discord-btn">
  <svg viewBox="0 0 127 96" width="28" fill="white">
    <path d="M107.7 8.07A105.15 105.15 0 0081.47 0..."/>
  </svg>
</a>

<script>
let currentPrice = 0;

function show(section, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(section).classList.add('active');
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
}

function openProduct(name, price, img, desc) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("pname").innerText = name;
  document.getElementById("pprice").innerText = "₪" + price;
  document.getElementById("pimg").src = img;
  document.getElementById("pdesc").innerText = desc;
  currentPrice = price;
}

function closeProduct() {
  document.getElementById("modal").style.display = "none";
}

function buy() {
  window.open("https://paypal.me/saharshevach/" + currentPrice);
}

window.onclick = function(e) {
  if (e.target === document.getElementById("modal")) closeProduct();
}
</script>

</body>
</html>
