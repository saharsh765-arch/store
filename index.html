<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyIL Store</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
  text-align: center;
}

.header {
  padding: 40px;
  font-size: 45px;
  font-weight: bold;
}

.sub {
  margin-bottom: 30px;
  color: #ccc;
}

.container {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
  padding: 20px;
}

.card {
  background: #111;
  padding: 25px;
  border-radius: 15px;
  width: 260px;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card h2 {
  color: #00bfff;
}

.price {
  font-size: 22px;
  margin: 10px 0;
}

.btn {
  background: #00bfff;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: black;
  font-weight: bold;
  transition: 0.3s;
}

.btn:hover {
  background: #009acd;
}

.footer {
  margin-top: 40px;
  padding: 20px;
  font-size: 14px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="header">SkyIL RolePlay Store</div>
<div class="sub">ברוכים הבאים לחנות הרשמית של השרת 🔥</div>

<div class="container">

  <!-- VIP -->
  <div class="card">
    <h2>VIP GOLD</h2>
    <p>VIP + הטבות מיוחדות</p>
    <div class="price">₪25</div>
    
    <a href="https://paypal.me/saharshevach/25" target="_blank">
      <button class="btn">קנה עכשיו</button>
    </a>
  </div>

  <!-- כסף -->
  <div class="card">
    <h2>100K כסף</h2>
    <p>כסף לשרת</p>
    <div class="price">₪10</div>
    
    <a href="https://paypal.me/saharshevach/10" target="_blank">
      <button class="btn">קנה עכשיו</button>
    </a>
  </div>

</div>

<div class="footer">
© SkyIL RolePlay - כל הזכויות שמורות
</div>

</body>
</html>
